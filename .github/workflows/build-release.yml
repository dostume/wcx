name: Build Release APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 允许 GITHUB_TOKEN 创建 Release 并上传 APK (默认只读会 403)
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史: build.gradle.kts 用 git rev-parse 生成 COMMIT_HASH
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore (optional)
        # 配置了 WEKIT_KEYSTORE_BASE64 仓库密钥时, 产出与本地一致的正式签名 APK;
        # 未配置时构建脚本自动回退 debug 签名, 仍可正常安装
        env:
          WEKIT_KEYSTORE_BASE64: ${{ secrets.WEKIT_KEYSTORE_BASE64 }}
        if: env.WEKIT_KEYSTORE_BASE64 != ''
        run: echo "$WEKIT_KEYSTORE_BASE64" | base64 -d > "$HOME/wcx-keystore.jks"

      - name: Build release APKs
        run: |
          ./gradlew --no-daemon assembleRelease \
            -x lintVitalStandardRelease -x lintVitalLegacyRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wcx-apks-${{ github.sha }}
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/*/release/*.apk
