name: Sync Upstream & Build APK

# 每天定时检查上游 Johnny520/wcx 是否更新:
#   有更新 -> 合并本仓库改动 -> 构建 4 个 Release APK -> 上传 Artifacts
#          -> 发布 GitHub Release (tag: auto-<上游短SHA>) -> 合并结果推回 master
#   无更新 -> 跳过构建 (定时触发时), 不产生任何费用
# 手动触发 (workflow_dispatch) 时始终构建, 并可用 force_release 强制发布 Release

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00, 每天一次
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: '上游仓库 (owner/name)'
        default: 'Johnny520/wcx'
        required: false
      upstream_branch:
        description: '上游分支'
        default: 'master'
        required: false
      force_release:
        description: '无上游更新时也强制构建并发布 Release'
        type: boolean
        default: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史: 合并上游需要共同祖先, build.gradle.kts 也要 git rev-parse
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${{ github.event.inputs.upstream_repo || 'Johnny520/wcx' }}.git"
          git fetch upstream "${{ github.event.inputs.upstream_branch || 'master' }}"

      - name: Record upstream commit
        id: upstream
        run: echo "sha=$(git rev-parse --short "upstream/${{ github.event.inputs.upstream_branch || 'master' }}")" >> "$GITHUB_OUTPUT"

      - name: Merge upstream changes
        id: merge
        run: |
          BASE=$(git rev-parse HEAD)
          if git merge --no-edit "upstream/${{ github.event.inputs.upstream_branch || 'master' }}"; then
            if [ "$(git rev-parse HEAD)" = "$BASE" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "## 合并结果: 上游无新提交, 已是最新" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "## 合并结果: 已合入上游新提交" >> "$GITHUB_STEP_SUMMARY"
              git log --oneline "$BASE..HEAD" >> "$GITHUB_STEP_SUMMARY" || true
            fi
          else
            echo "## 合并冲突" >> "$GITHUB_STEP_SUMMARY"
            echo '上游改动与本仓库改动冲突, 需要手动解决。冲突文件:' >> "$GITHUB_STEP_SUMMARY"
            git diff --name-only --diff-filter=U >> "$GITHUB_STEP_SUMMARY" || true
            git merge --abort
            exit 1
          fi

      - name: Push merge result back to master
        # GITHUB_TOKEN 的 push 不会再次触发本工作流 (GitHub 设计如此), 无循环风险
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:master

      - name: Set up JDK 21
        # 定时触发且上游无更新时跳过全部构建步骤, 节省 Actions 配额;
        # 手动触发始终构建
        if: steps.merge.outputs.changed == 'true' || github.event_name != 'schedule' || inputs.force_release == true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: steps.merge.outputs.changed == 'true' || github.event_name != 'schedule' || inputs.force_release == true
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore (optional)
        env:
          WEKIT_KEYSTORE_BASE64: ${{ secrets.WEKIT_KEYSTORE_BASE64 }}
        if: env.WEKIT_KEYSTORE_BASE64 != '' && (steps.merge.outputs.changed == 'true' || github.event_name != 'schedule' || inputs.force_release == true)
        run: echo "$WEKIT_KEYSTORE_BASE64" | base64 -d > "$HOME/wcx-keystore.jks"

      - name: Grant execute permission for gradlew
        # 仓库里的 gradlew 是 100644 (上游从 zip 重置源码时丢了执行位),
        # 不加 chmod 会直接 "./gradlew: Permission denied" (exit 126)。
        # ci.yml 里一直有这一步, 本工作流此前漏了, 导致 Release 构建失败。
        if: steps.merge.outputs.changed == 'true' || github.event_name != 'schedule' || inputs.force_release == true
        run: chmod +x gradlew

      - name: Build release APKs
        if: steps.merge.outputs.changed == 'true' || github.event_name != 'schedule' || inputs.force_release == true
        env:
          # 与下方 Publish 步骤的 tag 同源, 写入 APK 的 BuildConfig.RELEASE_TAG
          WCX_RELEASE_TAG: v274
        run: |
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifacts
        if: steps.merge.outputs.changed == 'true' || github.event_name != 'schedule' || inputs.force_release == true
        uses: actions/upload-artifact@v4
        with:
          name: wcx-apks-${{ github.run_id }}
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

      - name: Publish APKs to Release
        # 上游有更新 (或手动强制) 时发布 Release, tag 固定 v274 (应用 versionCode),
        # 重复发布会更新既有 Release, 不会堆积重复项
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v274
          name: v274
          body: |
            自动同步上游 Johnny520/wcx 后构建。

            本次重点 (联系人选择器):
            - 「标签 / 归拢 / 分组」筛选里的「全部」改名为「不限」, 不再和类型筛选的
              「全部 (数量)」重名
            - 单模式 (通常只有标签) 下不再显示筛选方式切换 chip, 「标签」二字不会
              再被误认成列表里的第一个标签项; 该分组没有可选项时整组隐藏
            - 联系人选择器以备注为准, 支持备注 / 拼音全拼 / 拼音首字母搜索,
              全屏显示, 常驻全选 / 全不选 / 反选, 修复微信标签筛选点不动的问题
            - 同步上游 v274 (Hchat 脚本页迁移、深色模式适配、rhino 依赖内置等)

            包含本仓库全部改动 (定时发送 777026 / 取消定时发送 777027 / 自定义通知铃声 等)。

            附件 4 个 APK: standard/legacy × arm64-v8a/armeabi-v7a,
            正式签名, 可直接覆盖安装。推荐 app-standard-arm64-v8a-release.apk。
          files: app/build/outputs/apk/*/release/*.apk
          fail_on_unmatched_files: true
