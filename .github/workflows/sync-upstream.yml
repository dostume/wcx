name: Sync Upstream & Build APK

# 纯云端流程: 拉取上游 Johnny520/wcx 最新代码 → 合并本仓库的定时发送等改动
# → 构建 4 个 Release APK → 上传 Artifacts → 把合并结果推回本仓库 master
# 全程不需要本地环境, 在 Actions 页手动触发即可

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: '上游仓库 (owner/name)'
        default: 'Johnny520/wcx'
        required: false
      upstream_branch:
        description: '上游分支'
        default: 'master'
        required: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史: 合并上游需要共同祖先, build.gradle.kts 也要 git rev-parse
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${{ github.event.inputs.upstream_repo || 'Johnny520/wcx' }}.git"
          git fetch upstream "${{ github.event.inputs.upstream_branch || 'master' }}"

      - name: Merge upstream changes
        id: merge
        run: |
          BASE=$(git rev-parse HEAD)
          if git merge --no-edit "upstream/${{ github.event.inputs.upstream_branch || 'master' }}"; then
            if [ "$(git rev-parse HEAD)" = "$BASE" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "## 合并结果: 上游无新提交, 已是最新" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "## 合并结果: 已合入上游新提交" >> "$GITHUB_STEP_SUMMARY"
              git log --oneline "$BASE..HEAD" >> "$GITHUB_STEP_SUMMARY" || true
            fi
          else
            echo "## 合并冲突" >> "$GITHUB_STEP_SUMMARY"
            echo '上游改动与本仓库改动冲突, 需要手动解决。冲突文件:' >> "$GITHUB_STEP_SUMMARY"
            git diff --name-only --diff-filter=U >> "$GITHUB_STEP_SUMMARY" || true
            git merge --abort
            exit 1
          fi

      - name: Push merge result back to master
        # GITHUB_TOKEN 的 push 不会再触发 Build Release 工作流 (GitHub 设计如此),
        # 但本工作流自身已包含构建步骤, 不受影响
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:master

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore (optional)
        env:
          WEKIT_KEYSTORE_BASE64: ${{ secrets.WEKIT_KEYSTORE_BASE64 }}
        if: env.WEKIT_KEYSTORE_BASE64 != ''
        run: echo "$WEKIT_KEYSTORE_BASE64" | base64 -d > "$HOME/wcx-keystore.jks"

      - name: Build release APKs
        run: |
          ./gradlew --no-daemon assembleRelease \
            -x lintVitalStandardRelease -x lintVitalLegacyRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wcx-apks-${{ github.run_id }}
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
