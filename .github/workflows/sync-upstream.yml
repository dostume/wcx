name: Sync Upstream & Build APK

# 默认**不**自动跟随上游更新 (2026-10-11 按用户要求关闭每日定时任务):
#   需要同步上游 / 出 APK 时, 到 Actions 页手动 Run workflow;
#   勾选 force_release 才会发布 (刷新) GitHub Release。
#   想恢复"上游一更新就自动跟随"的话, 取消下面 schedule 的注释即可。
#
# 手动触发 (workflow_dispatch) 时始终构建, 并可用 force_release 强制发布 Release

on:
  # schedule:
  #   # UTC 01:00 = 北京时间 09:00, 每天一次
  #   - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: '先合并上游最新提交再构建 (默认关闭, 只构建当前 master)'
        type: boolean
        default: false
      upstream_repo:
        description: '上游仓库 (owner/name)'
        default: 'Johnny520/wcx'
        required: false
      upstream_branch:
        description: '上游分支'
        default: 'master'
        required: false
      force_release:
        description: '无上游更新时也强制构建并发布 Release'
        type: boolean
        default: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史: 合并上游需要共同祖先, build.gradle.kts 也要 git rev-parse
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        # 默认不跟随上游: 只有显式勾选 sync_upstream 才会拉取并合并上游
        if: inputs.sync_upstream == true
        run: |
          git remote add upstream "https://github.com/${{ github.event.inputs.upstream_repo || 'Johnny520/wcx' }}.git"
          git fetch upstream "${{ github.event.inputs.upstream_branch || 'master' }}"

      - name: Record upstream commit
        id: upstream
        if: inputs.sync_upstream == true
        run: echo "sha=$(git rev-parse --short "upstream/${{ github.event.inputs.upstream_branch || 'master' }}")" >> "$GITHUB_OUTPUT"

      - name: Merge upstream changes
        id: merge
        if: inputs.sync_upstream == true
        run: |
          BASE=$(git rev-parse HEAD)
          if git merge --no-edit "upstream/${{ github.event.inputs.upstream_branch || 'master' }}"; then
            if [ "$(git rev-parse HEAD)" = "$BASE" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "## 合并结果: 上游无新提交, 已是最新" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "## 合并结果: 已合入上游新提交" >> "$GITHUB_STEP_SUMMARY"
              git log --oneline "$BASE..HEAD" >> "$GITHUB_STEP_SUMMARY" || true
            fi
          else
            echo "## 合并冲突" >> "$GITHUB_STEP_SUMMARY"
            echo '上游改动与本仓库改动冲突, 需要手动解决。冲突文件:' >> "$GITHUB_STEP_SUMMARY"
            git diff --name-only --diff-filter=U >> "$GITHUB_STEP_SUMMARY" || true
            git merge --abort
            exit 1
          fi

      - name: Push merge result back to master
        # GITHUB_TOKEN 的 push 不会再次触发本工作流 (GitHub 设计如此), 无循环风险
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:master

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore (optional)
        env:
          WEKIT_KEYSTORE_BASE64: ${{ secrets.WEKIT_KEYSTORE_BASE64 }}
        if: env.WEKIT_KEYSTORE_BASE64 != ''
        run: echo "$WEKIT_KEYSTORE_BASE64" | base64 -d > "$HOME/wcx-keystore.jks"

      - name: Read version from build.gradle.kts
        id: version
        # 版本号单一数据源, 与 ci.yml 完全一致 —— 两个工作流必须发布同一个 tag,
        # 否则会出现「应用内显示 v281 / Releases 页面却是别的版本」的不一致。
        run: |
          VERSION_CODE=$(grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+$')
          echo "tag=v${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "本次发布 tag: v${VERSION_CODE}"

      - name: Grant execute permission for gradlew
        # 仓库里的 gradlew 是 100644 (上游从 zip 重置源码时丢了执行位),
        # 不加 chmod 会直接 "./gradlew: Permission denied" (exit 126)。
        # ci.yml 里一直有这一步, 本工作流此前漏了, 导致 Release 构建失败。
        run: chmod +x gradlew

      - name: Build release APKs
        env:
          # 与下方 Publish 步骤的 tag 同源, 写入 APK 的 BuildConfig.RELEASE_TAG
          WCX_RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wcx-apks-${{ github.run_id }}
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

      - name: Publish APKs to Release
        # 上游有更新 (或手动强制) 时发布 Release; tag 取 build.gradle.kts 的 versionCode,
        # 与 ci.yml 写同一个 Release, 重复发布只会更新它, 不会堆积
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WCX ${{ steps.version.outputs.tag }}
          body: |
            ## WCX ${{ steps.version.outputs.tag }}

            基线为上游 v273，保留本仓库自建功能 + 联系人选择器改进。

            ### 本版修复（v281）

            - **「完整显示昵称」更名为「完整显示备注名」，并修复聊天页标题仍被截断**：
              微信这三处显示的「名字」优先取备注名（未设备注才退化昵称），
              原名与实不符；设备截图实锤聊天页标题仍是「头部9字...尾部8字」——
              注意是三个 ASCII 点而非 Android 原生 ellipsize 的单字符「…」，
              说明**标题文本自身已被微信在代码里截断**，放开 singleLine/ellipsize
              这类渲染级手段完全无效（v275 的聊天标题处理因此从未真正生效）。
              现改为：标题栏挂 TextWatcher，检测到中部省略号时用备注名
              （rcontact.conRemark → nickname）还原完整文本并放开换行；
              还原前以「头尾吻合 + 完整名更长」双校验，杜绝误伤含「...」的正常文本
            - 聊天页 hook 加固：dealContentView（内容视图三种形态兼容）+
              onResume 双入口，聊天对象经 ChattingContext.getTalker /
              Activity intent(Chat_User) / 会话列表 field_username 三源捕获，
              不再因 hook 装晚或标题后配置而漏掉
            - 会话列表行同样补齐代码级截断还原（行文本含「...」时按备注名还原），
              渲染级截断（会话列表/通讯录）沿用既有的单行放开方案
            - 全链路 I 级日志：标题还原成功/失败（含 truncated 原文与 talker）、
              操作栏处理条目数均可查，失败时给出诊断信息

            ### 上一版（v280）

            - **文件/图片"假缓存"：日志显示缓存成功，微信里始终显示未下载**
              （设备日志实锤，本次漏下载的真正根因）：
              从 ContentValues 重建 msgInfo 时 convertFrom 不填 field_msgId，
              导致 appattach 的查询与建行全部落到 msgInfoId=0 的"幽灵行"上——
              查询侧把无关文件的旧行误判为"已缓存"直接返回（4 个不同文件
              几毫秒内全部"缓存成功"且返回同一个路径），建行侧微信 UI 按真实
              主键查不到行，气泡永远显示"未下载"。现重建后显式补齐
              field_msgId/field_msgSvrId，appattach 查询同时兼容两种主键语义；
              另修复 convertFrom(Cursor) 路径的同型隐患
            - **自动缓存被黑白名单静默挡下，日志完全不可见**（设备日志实锤）：
              扫描每轮都找到待缓存的文件却一个都不发起，只因被
              「自动缓存文件 / 图片」设置里的黑/白名单过滤；而"被名单过滤"
              等跳过日志是 D 级，release 构建会直接丢弃 D 级日志，
              导致问题数月无法定位。现将 onEnable 名单配置、扫描每行跳过原因
              （含 talker 与名单描述）、事件各分流全部提级为 I/W 可见日志，
              高频预筛分流改用计数器按轮汇总
            - **图片补偿扫描此前绕过名单过滤**（事件路径过滤、扫描路径不过），
              现统一过名单，行为一致
            - **设置弹窗新增「清空黑/白名单」入口**：配错名单后可一键恢复
              全部缓存，不必进选择器逐个取消（变更需重启微信生效）
            - **联系人选择器确定按钮显示残缺括号**：原实现
              `"确定 (".format(数量)` 格式串漏了 %d，参数被丢弃，按钮只显示
              "确定 ("；已选数量改为展示在「全选/全不选/反选」行右侧
              （"已选 N"），不再挤占按钮

            ### 上一版（v279）

            - **联系人选择器底部按钮消失**（全屏弹窗）：全屏模式下内容区
              使用 fillMaxSize() 占满剩余高度，把「取消 / 确定」按钮行挤成 0 高度，
              用户完全看不到也无法确认；现内容区改为 weight(1f) 只占剩余空间，
              按钮行固定悬浮在底部
            - **联系人选择器筛选区压缩**：类型筛选（全部/好友/群聊/公众号/其他）
              与「标签 / 归拢 / 分组」筛选合并为同一行横向滚动（组间竖线分隔），
              比原来两行堆叠省一整行高度；所有 chip 统一 28dp 高、12sp 字，
              行间距收紧，筛选区整体缩小约三分之一

            ### 上一版（v278）

            - **重置 dex 缓存后自动缓存扫描整轮失败**（设备日志实锤，主微信/分身均复现）：
              手动重置适配信息会触发全量重适配，该窗口内 `WeDatabaseApi` 的
              getStorage hook 尚未安装，或安装时微信早已调用过 getStorage
              （hookAfter 永不触发），`db` 一直处于未初始化状态，
              补偿扫描连续报 `lateinit property db has not been initialized` 整轮报废，
              期间收到的文件/图片全部漏下载；
              现新增 **ensureDatabase() 按需初始化**：首次真正需要数据库时主动调用
              getStorage 补取 db，rawQuery/delete/executeQuery 入口统一兜底
            - **扫描失败快速重试**：db 未就绪时不再死等 3 分钟，按失败轮次逐步
              加快（最短约 15s 一轮），就绪后自动回到 180s 正常周期
            - **talker 反查失败不再丢消息**：talker 本就只用于黑白名单过滤，
              未配置名单时即使事件未携带该列、反查失败也照常缓存；
              已配置名单时才保守跳过，由补偿轮在 db 就绪后补扫
              （修复日志中 `cannot resolve talker, skip` 一类误丢）

            ### 上一版（v277）

            - **自动缓存文件 / 自动缓存图片仍有机率漏下载**（v276 补偿扫描不彻底）：
              - 补偿扫描从「只扫一次」改为**每 3 分钟持续扫描**：v276 只在开启后扫一轮，
                若功能是在消息落库之后才开启（或监听器注册晚于消息落库），
                之后错过的消息永远补不上；现每轮扫描 + 重试 pending，任何时刻漏掉的消息
                都能在下一轮被补上
              - **全链路日志**：开启/关闭、每条 insert/update 事件的每个分流（类型不符、
                黑白名单、对方上传中、暂不可下载、字段缺失、msgId 反查结果）、
                每轮扫描条数与发起数、每条缓存成功/失败均打日志，彻底消除静默 return，
                下次出问题可直接从日志定位
              - 文件 update 事件新增廉价预筛：既不带新 content 又不带 msgSvrId 的
                message 表更新（status/已读等高频更新）不再逐条查库
              - 未知/暂不可下载的 appmsg 类型由「直接跳过」改为「记入 pending 持续重试」，
                对方上传完成/类型就绪后由补偿轮按 msgId 重新查库拿到新值
              - 修复设置页「检查更新」在页面快速滑走时刷
                `The coroutine scope left the composition` 错误日志（协程取消被误记为异常）

            ### 上一版（v276）

            - **自动缓存文件 / 自动缓存图片漏下载**：
              - 文件：微信「对方上传完成」的更新事件只带被更新的列（常缺 type/msgSvrId），
                旧逻辑直接丢弃导致 defer 的消息永远触发不了下载；现按 msgId 反查补齐字段，
                更新事件带来的新 content 优先用于触发下载
              - 图片：insert 时 ImgInfo2 行可能尚未写入、CDN 未必就绪，旧逻辑单次失败即放弃；
                现改为立即 + 延迟共 3 次重试，并监听 update 事件兜底（微信下载状态变化时再触发）
              - 两者均增加补偿扫描：开启后先回看近 6 小时的媒体消息，之后每 3 分钟重试未成功项；
                下载并发限 3，失败项保留待后续事件/补偿轮重试，不再一次定论

            ### 上一版（v275）

            - **完整显示昵称**（设置 → 聊天 开启）：微信会话列表 / 通讯录 / 好友聊天页标题的昵称
              不再被截断成「...」，过长时自动换行。仅改这三处，其它界面不受影响
            - **联系人选择器**：默认按「最近聊天」排序（「最近」排筛选组第一位）；去掉 wxid 显示，
              wxid 也不再参与搜索（保留自定义微信号精确兜底）；支持 备注 / 拼音全拼 / 拼音首字母 搜索
            - **弹窗尺寸自适应**：内容少时面板高度随内容收缩，不再撑满全屏留大片空白

            ### 联系人选择器其它改进

            - 「标签 / 归拢 / 分组」筛选里的「全部」改名「不限」，不再与类型筛选的「全部 (数量)」重名
            - 单模式下不再显示筛选方式切换 chip，「标签」二字不会被认成列表第一个标签项
            - 该分组没有可选项时整组隐藏
            - 全屏显示；全选 / 全不选 / 反选 常驻一行
            - 修复微信标签筛选点不动、选中标签后选不到人的问题

            ### 本次恢复的自建功能

            - **自定义通知铃声**：消息通知改用私有通知渠道改道播放自定义铃声
            - **定时发送消息（复读式）**：消息长按菜单「定时发送 / 取消定时发送」；
              创建任务不再触发 CDN 下载，发送时按复读通道重建权威消息对象（图文/语音/视频/文件）
            - **一键关闭所有日志**：设置页开关，开启后不输出 logcat、不写模块日志文件、
              不写崩溃日志；同时清理了绕过开关的旁路日志通道（侧边栏 diag.log 等）
            - **分身（999）配置隔离**：MMKV ID 按宿主包名区分，主微信与分身配置不再互相污染
            - **模块设置入口稳定性**：修正 onNewIntent 读取旧 intent 导致要点多次才生效
            - **微信 8.0.76 兼容**：圆角头像解析失败降级、PopupWindow 弹窗崩溃防护
            - **程序内链接与更新检查**统一指向 dostume/wcx

            ### DEX 适配稳定性

            - 单项适配加 120 秒超时，挂死时不再让整个流程停在进度条上
            - 适配并发 8 → 3，降低 native 与内存压力
            - DexKit 空闲回收 30 秒 → 120 秒，避免在 native 查询进行中被关闭
            - 失败项记下「已尝试」印记，同一版本上不再每次启动都弹框

            附件 4 个 APK: standard/legacy × arm64-v8a/armeabi-v7a,
            正式签名, 可直接覆盖安装。推荐 app-standard-arm64-v8a-release.apk。
          files: app/build/outputs/apk/*/release/*.apk
          fail_on_unmatched_files: true
